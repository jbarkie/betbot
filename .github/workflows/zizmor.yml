name: Security Analysis with zizmor

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  zizmor-analysis:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      # Required for SARIF upload to code scanning
      security-events: write
      contents: read
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          persist-credentials: false
          
      - name: Install uv package manager
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        
      - name: Run zizmor analysis
        run: |
          uvx zizmor --format sarif \
            --persona pedantic \
            --min-severity medium \
            .github/workflows/ > zizmor-results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload analysis results
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311
        with:
          sarif_file: zizmor-results.sarif
          category: zizmor